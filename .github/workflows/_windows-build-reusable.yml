name: Windows Build (Reusable)

on:
  workflow_call:
    inputs:
      build_type:
        description: CMake build type
        required: false
        default: Release
        type: string
      upload_name:
        description: Artifact name prefix
        required: true
        type: string
      package_zip:
        description: Produce portable zip package
        required: false
        default: false
        type: boolean
    secrets:
      BONJOUR_SDK_BUNDLE_URL:
        required: true
      FFMPEG_BUNDLE_URL:
        required: true
      OPENSSL_BUNDLE_URL:
        required: true

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_DIR: build
      INSTALL_DIR: install
      DEPS_DIR: deps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base

      - name: Cache dependency bundle downloads
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_DIR }}
          key: windows-deps-${{ runner.os }}-${{ hashFiles('.github/workflows/_windows-build-reusable.yml') }}-${{ secrets.BONJOUR_SDK_BUNDLE_URL }}-${{ secrets.FFMPEG_BUNDLE_URL }}-${{ secrets.OPENSSL_BUNDLE_URL }}

      - name: Download dependency bundles
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $bonjourUrl = "${{ secrets.BONJOUR_SDK_BUNDLE_URL }}"
          $ffmpegUrl = "${{ secrets.FFMPEG_BUNDLE_URL }}"
          $opensslUrl = "${{ secrets.OPENSSL_BUNDLE_URL }}"

          if ([string]::IsNullOrWhiteSpace($bonjourUrl) -or [string]::IsNullOrWhiteSpace($ffmpegUrl) -or [string]::IsNullOrWhiteSpace($opensslUrl)) {
            throw "Dependency bundle URL secrets are not configured. Set BONJOUR_SDK_BUNDLE_URL, FFMPEG_BUNDLE_URL, and OPENSSL_BUNDLE_URL in the calling workflow/repository secrets."
          }

          New-Item -ItemType Directory -Path "$env:DEPS_DIR" -Force | Out-Null
          Invoke-WebRequest -Uri $bonjourUrl -OutFile "$env:DEPS_DIR/bonjour-sdk.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "$env:DEPS_DIR/ffmpeg.zip"
          Invoke-WebRequest -Uri $opensslUrl -OutFile "$env:DEPS_DIR/openssl.zip"

      - name: Extract dependency bundles
        shell: pwsh
        run: |
          Expand-Archive -Path "$env:DEPS_DIR/bonjour-sdk.zip" -DestinationPath "$env:DEPS_DIR/bonjour" -Force
          Expand-Archive -Path "$env:DEPS_DIR/ffmpeg.zip" -DestinationPath "$env:DEPS_DIR/ffmpeg" -Force
          Expand-Archive -Path "$env:DEPS_DIR/openssl.zip" -DestinationPath "$env:DEPS_DIR/openssl" -Force

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          export BONJOUR_SDK_HOME="${GITHUB_WORKSPACE//\\//}/deps/bonjour"
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}"

      - name: Build
        shell: msys2 {0}
        run: cmake --build "$BUILD_DIR" --config "${{ inputs.build_type }}" --parallel

      - name: Install portable tree
        shell: msys2 {0}
        run: cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact/logs -Force | Out-Null
          if (Test-Path "$env:BUILD_DIR/CMakeCache.txt") {
            Copy-Item "$env:BUILD_DIR/CMakeCache.txt" artifact/logs/
          }
          if (Test-Path "$env:BUILD_DIR/CMakeFiles/CMakeOutput.log") {
            Copy-Item "$env:BUILD_DIR/CMakeFiles/CMakeOutput.log" artifact/logs/
          }
          if (Test-Path "$env:BUILD_DIR/CMakeFiles/CMakeError.log") {
            Copy-Item "$env:BUILD_DIR/CMakeFiles/CMakeError.log" artifact/logs/
          }


      - name: Validate runtime rendering paths
        shell: pwsh
        run: |
          ./tools/windows/validate-rendering.ps1 -LogPath artifact/logs/rendering-validation.json

      - name: Build portable package layout
        if: inputs.package_zip
        shell: pwsh
        run: |
          ./tools/windows/New-PortablePackage.ps1 -RepoRoot . -OutDir artifact/windows-portable -ZipPath "artifact/uxplay-windows-${{ github.ref_name }}.zip"

      - name: Validate Windows runtime dependencies
        if: inputs.package_zip
        shell: pwsh
        run: |
          $binDir = (Resolve-Path "artifact/windows-portable/bin").Path
          $systemDirs = @(
            "$env:WINDIR\System32",
            "$env:WINDIR\SysWOW64"
          )
          $targets = Get-ChildItem $binDir -Filter *.exe
          $targets += Get-ChildItem $binDir -Filter *.dll
          foreach ($target in $targets) {
            $output = & dumpbin /dependents $target.FullName 2>$null
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for $($target.Name)" }
            $deps = $output | Where-Object { $_ -match "\.dll" } | ForEach-Object { $_.Trim() } | Sort-Object -Unique
            foreach ($dep in $deps) {
              $exists = Test-Path (Join-Path $binDir $dep)
              if (!$exists) {
                foreach ($sd in $systemDirs) {
                  if (Test-Path (Join-Path $sd $dep)) { $exists = $true; break }
                }
              }
              if (!$exists) { throw "Unresolved import for $($target.Name): $dep" }
            }
          }

      - name: Validate release artifact directory shape
        if: inputs.package_zip
        shell: pwsh
        run: |
          if (!(Test-Path artifact/windows-portable/bin/uxplay.exe)) { throw "artifact/windows-portable/bin/uxplay.exe missing" }
          if (!(Test-Path artifact/windows-portable/lib)) { throw "artifact/windows-portable/lib missing" }
          if (!(Test-Path artifact/windows-portable/README-Windows-Portable.md)) { throw "portable README missing" }
          if (!(Test-Path artifact/logs/CMakeCache.txt)) { throw "artifact/logs/CMakeCache.txt missing" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload_name }}-${{ inputs.build_type }}
          path: artifact
          if-no-files-found: error
